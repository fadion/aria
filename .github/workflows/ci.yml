name: CI

on:
  # Only master on push. A branch with a PR open is covered by pull_request,
  # and listening for both ran every one of them twice.
  #
  # paths-ignore lists the files nothing here reads. README.md is deliberately
  # not among them: the language job runs every one of its code blocks through
  # the interpreter, so it is executable and a change to it can fail CI.
  # Anchors would say this once, but Actions does not expand them.
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go side, on every platform we ship a binary for.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # gofmt only on Linux: git on the Windows runner checks out CRLF, which
      # gofmt reports as a diff in every file.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

  # Static analysis beyond `go vet`. Ubuntu only: the linters are
  # platform-independent, and running them three times says the same thing
  # three times.
  #
  # This replaces the Go Report Card badge the README used to carry. That
  # service is retired -- its badge now renders the word "retired" -- and its
  # own site points at golangci-lint instead.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The linter version is pinned, unlike the actions above. A new
      # golangci-lint release can add checks, and a green branch turning red
      # because a tool updated overnight is not a signal about this repo.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  # The language side. Ubuntu only: both scripts need bash 4 (mapfile) and GNU
  # coreutils (timeout), and the macOS runner ships bash 3.2 with neither.
  language:
    name: language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Both scripts build their own interpreter, but building it once here
      # keeps them from doing it twice and puts a compile error in its own step.
      - name: Build the interpreter
        run: go build -o aria .

      - name: Characterization suite
        run: bash scripts/characterize.sh verify

      - name: README code blocks
        run: bash scripts/check-readme.sh

      - name: Examples
        run: bash scripts/check-examples.sh

  # Cheap, and both targets have found real bugs. 30s each, as in CLAUDE.md.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Any failure fails the job, timeouts included. A parser that hangs on
      # some input and a runner too busy to shut the coordinator down look
      # identical from here -- both come back as "context deadline exceeded"
      # with nothing written -- and non-termination is a bug class this repo
      # takes seriously enough not to guess about.
      - name: Fuzz the scanner
        run: go test ./internal/scanner/ -run=Fuzz -fuzz=FuzzScan -fuzztime=30s

      - name: Fuzz the parser
        run: go test ./internal/parser/ -run=Fuzz -fuzz=FuzzParse -fuzztime=30s

      # Which of the two it was, without having to download anything. This
      # only labels the failure; the job is already failing either way.
      - name: Say which kind of failure it was
        if: failure()
        run: |
          if [ -n "$(find internal -path '*/testdata/fuzz/*' -type f 2>/dev/null)" ]; then
            echo "::error::a fuzz target found a failing input, attached below as fuzz-corpus"
          else
            echo "::warning::no failing input was written, so this is a hang or a loaded runner; re-run to tell them apart"
          fi

      # A crasher is written to testdata/fuzz, which is gitignored and would
      # otherwise be thrown away with the runner.
      - name: Save the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
