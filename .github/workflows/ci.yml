name: CI

on:
  # Only master on push. A branch with a PR open is covered by pull_request,
  # and listening for both ran every one of them twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go side, on every platform we ship a binary for.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # gofmt only on Linux: git on the Windows runner checks out CRLF, which
      # gofmt reports as a diff in every file.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

  # The language side. Ubuntu only: both scripts need bash 4 (mapfile) and GNU
  # coreutils (timeout), and the macOS runner ships bash 3.2 with neither.
  language:
    name: language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Both scripts build their own interpreter, but building it once here
      # keeps them from doing it twice and puts a compile error in its own step.
      - name: Build the interpreter
        run: go build -o aria .

      - name: Characterization suite
        run: bash scripts/characterize.sh verify

      - name: README code blocks
        run: bash scripts/check-readme.sh

  # Cheap, and both targets have found real bugs. 30s each, as in CLAUDE.md.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `go test -fuzz` fails for two unrelated reasons, and they need telling
      # apart. A failing input is a bug and gets written to testdata/fuzz. A
      # coordinator that cannot shut its workers down inside the deadline
      # reports "context deadline exceeded", writes nothing, and means only
      # that the runner was busy -- one run failed that way a second after
      # fuzztime elapsed, having already stalled at 0 execs/sec for 21s.
      #
      # So: a written input fails the job immediately. Anything else is retried
      # once, on the same runner, where GOCACHE still holds the corpus the
      # first attempt built up -- a real hang has a good chance of being found
      # again rather than waved through. Twice with nothing written still fails.
      - name: Fuzz the scanner and parser
        run: |
          crashers() { find internal -path '*/testdata/fuzz/*' -type f 2>/dev/null; }

          fuzz() {
            local pkg=$1 target=$2 attempt
            for attempt in 1 2; do
              if go test "$pkg" -run=Fuzz -fuzz="$target" -fuzztime=30s; then
                return 0
              fi
              if [ -n "$(crashers)" ]; then
                echo "::error::$target found a failing input"
                return 1
              fi
              echo "::warning::$target failed on attempt $attempt without writing a failing input, which points at the fuzzing harness rather than at $pkg"
            done
            echo "::error::$target failed twice without writing a failing input"
            return 1
          }

          fuzz ./internal/scanner/ FuzzScan || exit 1
          fuzz ./internal/parser/  FuzzParse || exit 1

      # A crasher is written to testdata/fuzz, which is gitignored and would
      # otherwise be thrown away with the runner.
      - name: Save the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
